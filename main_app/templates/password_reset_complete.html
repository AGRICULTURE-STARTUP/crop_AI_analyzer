{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgriScan | Password Reset Complete</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}?v=1.3">
    <link rel="icon" type="image/png" href="{% static 'images/agriscan_favicon.png' %}">
</head>

<body class="auth-page">
    <main>
        <div class="auth-card animate-up" style="max-width: 450px; text-align: center;">
            <div class="auth-header-modern">
                <i class="fa-solid fa-circle-check" style="font-size: 3rem; color: #388e3c; margin-bottom: 1.5rem;"></i>
                <h2>Password Reset!</h2>
                <p>Your password has been successfully reset. You can now log in with your new password.</p>
            </div>

            <div class="auth-footer-modern">
                <a href="{% url 'login' %}" class="auth-submit-btn" style="text-decoration: none; display: block;">Log In Now</a>
            </div>
        </div>
    </main>
    <div class="video-container">
        <video autoplay muted loop playsinline class="video-bg">
            <source src="{% static 'video/8659244-hd_1920_1080_30fps.mp4' %}" type="video/mp4">
            Your browser does not support the video tag.
        </video>
        <div class="video-overlay"></div>
    </div>
</body>

</html>
