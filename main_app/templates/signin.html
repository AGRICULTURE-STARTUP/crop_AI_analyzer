{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgriScan | Log In</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <style>
        .auth-container {
            width: 100%;
            max-width: 450px;
            margin: 4rem auto;
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.07);
            padding: 2.5rem 2rem;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .auth-header {
            text-align: center;
            margin-bottom: 1rem;
            color: #388e3c;
            font-size: 1.8rem;
            font-weight: 700;
        }

        .form-group {
            margin-bottom: 1.2rem;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .form-group label {
            font-weight: 600;
            color: #444;
        }

        .form-control {
            padding: 0.8rem;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 1rem;
            width: 100%;
        }

        .form-control:focus {
            border-color: #388e3c;
            outline: none;
            box-shadow: 0 0 0 2px rgba(56, 142, 60, 0.1);
        }

        .auth-footer {
            text-align: center;
            margin-top: 1.5rem;
            font-size: 0.95rem;
            color: #666;
        }

        .auth-footer a {
            color: #388e3c;
            text-decoration: none;
            font-weight: 600;
        }

        .auth-footer a:hover {
            text-decoration: underline;
        }

        .submit-btn {
            width: 100%;
            padding: 0.8rem;
            background-color: #388e3c;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s;
        }

        .submit-btn:hover {
            background-color: #2e7031;
        }

        .error-message {
            color: #d32f2f;
            font-size: 0.85rem;
            margin-top: 0.3rem;
        }

        .signup-options {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 0.5rem;
            margin-top: 1rem;
        }

        .signup-btn {
            padding: 0.5rem;
            font-size: 0.8rem;
            background: #f1f8e9;
            color: #388e3c;
            border: 1px solid #c8e6c9;
            border-radius: 6px;
            text-decoration: none;
            text-align: center;
        }

        .signup-btn:hover {
            background: #e8f5e9;
        }
    </style>
</head>

<body>
    <header>
        <h1>AgriScan</h1>
        <nav class="nav_bar">
            <ul class="nav_list">
                <li><a href="{% url 'page' %}">Home</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <div class="auth-container">
            <div class="auth-header">Welcome Back</div>
            <form method="post">
                {% csrf_token %}
                {% for field in form %}
                <div class="form-group">
                    <label for="{{ field.id_for_label }}">{{ field.label }}</label>
                    <input type="{{ field.field.widget.input_type }}" name="{{ field.name }}"
                        id="{{ field.id_for_label }}" class="form-control" placeholder="{{ field.label }}">
                    {% if field.errors %}
                    <div class="error-message">{{ field.errors.0 }}</div>
                    {% endif %}
                </div>
                {% endfor %}
                <button type="submit" class="submit-btn">Log In</button>
            </form>
            <div class="auth-footer">
                <a href="{% url 'forgot_password' %}">Forgot Password?</a>
                <br><br>
                Don't have an account? Sign Up as:
                <div class="signup-options">
                    <a href="{% url 'signup_farmer' %}" class="signup-btn">Farmer</a>
                    <a href="{% url 'signup_buyer' %}" class="signup-btn">Buyer</a>
                    <a href="{% url 'signup_agency' %}" class="signup-btn">Agency</a>
                </div>
            </div>
        </div>
    </main>
</body>

</html>
