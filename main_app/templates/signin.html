{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgriScan | Log In</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}?v=1.2">
    <link rel="icon" type="image/png" href="{% static 'images/agriscan_favicon.png' %}">
</head>

<body class="auth-page">
    <main>
        <div class="auth-card animate-up" style="max-width: 450px;">
            <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 1rem;">
                <a href="{% url 'homepage' %}" style="color: #388e3c; text-decoration: none; font-weight: 500; font-size: 0.9rem; display: flex; align-items: center; gap: 0.4rem;">
                    <i class="fa-solid fa-house"></i> Home
                </a>
            </div>
            <div class="auth-header-modern">
                <h2>Welcome Back</h2>
                <p>Log in to access your agricultural dashboard.</p>
            </div>

            <form method="post">
                {% csrf_token %}
                <div class="form-grid" style="grid-template-columns: 1fr;">
                    {% for field in form %}
                    <div class="form-group full-width">
                        <label class="form-label" for="{{ field.id_for_label }}">{{ field.label }}</label>
                        <input type="{{ field.field.widget.input_type }}" name="{{ field.name }}"
                            id="{{ field.id_for_label }}" class="form-input-modern"
                            placeholder="Enter {{ field.label }}">
                        {% if field.errors %}
                        <div class="error-message" style="color: #d32f2f; font-size: 0.8rem; margin-top: 0.3rem;">
                            {{field.errors.0 }}</div>
                        {% endif %}
                    </div>
                    {% endfor %}
                </div>
                <div class="form-group full-width" style="margin-bottom: 1.5rem; display: flex; align-items: center; gap: 0.5rem;">
                    <input type="checkbox" id="privacy-accept" name="privacy-accept" required style="width: auto; margin: 0;">
                    <label for="privacy-accept" style="font-size: 0.9rem; color: #666; cursor: pointer;">I accept the rules in the <a href="{% url 'privacy_policy' %}" target="_blank" style="color: #388e3c; text-decoration: underline;">Privacy Policy</a></label>
                </div>
                <button type="submit" class="auth-submit-btn">Log In</button>
            </form>

            <div class="auth-footer-modern">
                <a href="{% url 'password_reset' %}" style="display: block; margin-bottom: 1rem;">Forgot Password?</a>
                Don't have an account? Sign Up as:
                <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 0.8rem; margin-top: 1rem;">
                    <a href="{% url 'signup_farmer' %}" class="btn-contact"
                        style="text-align: center; padding: 0.5rem; font-size: 0.85rem;">Farmer</a>
                    <a href="{% url 'signup_buyer' %}" class="btn-contact"
                        style="text-align: center; padding: 0.5rem; font-size: 0.85rem;">Buyer</a>
                    <a href="{% url 'signup_agency' %}" class="btn-contact"
                        style="text-align: center; padding: 0.5rem; font-size: 0.85rem;">Agency</a>
                </div>
            </div>
        </div>
    </main>
     <div class="video-container">
        <video autoplay muted loop playsinline class="video-bg">
            <source src="{% static 'video/8659244-hd_1920_1080_30fps.mp4' %}" type="video/mp4">
            Your browser does not support the video tag.
        </video>
        <div class="video-overlay"></div>
    </div>

</body>

</html>
