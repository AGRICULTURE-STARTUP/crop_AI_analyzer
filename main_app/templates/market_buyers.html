{% extends 'base.html' %}
{% load static %}

{% block title %}AgriScan | Market{% endblock %}

{% block content %}


    <div class="fertilisers-container">
        <div class="fertilisers-header">
            <h2>Buyer & Market Directory</h2>
            <p>Connect with agriculture buyers and market players in your region.</p>

            <!-- KAMIS Market Prices Banner -->
            <a href="https://kamis.kilimo.go.ke/" target="_blank" rel="noopener noreferrer"
               style="display: inline-flex; align-items: center; gap: 0.6rem; margin-top: 1.2rem; padding: 0.75rem 1.4rem; background: linear-gradient(135deg, #1b5e20 0%, #388e3c 100%); color: #fff; border-radius: 50px; text-decoration: none; font-size: 0.95rem; font-weight: 600; box-shadow: 0 4px 14px rgba(56,142,60,0.35); transition: transform 0.2s ease, box-shadow 0.2s ease;"
               onmouseover="this.style.transform='translateY(-2px)';this.style.boxShadow='0 6px 20px rgba(56,142,60,0.5)';"
               onmouseout="this.style.transform='translateY(0)';this.style.boxShadow='0 4px 14px rgba(56,142,60,0.35)';">
                <i class="fa-solid fa-chart-line"></i>
                Check Live Agricultural Market Prices (KAMIS)
                <i class="fa-solid fa-arrow-up-right-from-square" style="font-size: 0.8rem;"></i>
            </a>

            <div class="search-bar" style="margin-top: 1.5rem; display: flex; justify-content: center; gap: 0.5rem; flex-wrap: wrap;">
                <input type="text" id="county-search" placeholder="Enter county to search..." style="padding: 0.8rem 1rem; border: 1px solid var(--border-color); border-radius: 8px; width: 100%; max-width: 300px; font-size: 1rem; outline: none; background: var(--input-bg); color: var(--text-primary);">
                <button id="search-btn" class="btn-primary" style="padding: 0.8rem 1.5rem; border-radius: 8px; cursor: pointer;">Search</button>
                <button id="fetch-buyers-btn" class="btn-secondary" style="padding: 0.8rem 1.5rem; border-radius: 8px; cursor: pointer; background: var(--bg-primary); color: var(--text-primary); border: 1px solid var(--border-color);">Show All</button>
            </div>
        </div>

        <div class="table-responsive">
            <div id="buyers-grid" class="firms-grid">
                <!-- Data will be populated here -->
            </div>
        </div>
    </div>

    <script>
        function renderBuyers(buyerList) {
            const grid = document.getElementById('buyers-grid');
            grid.innerHTML = '';
            if (buyerList && buyerList.length > 0) {
                buyerList.forEach((buyer, index) => {
                    const card = document.createElement('div');
                    card.className = 'firm-card animate-up';
                    card.style.animationDelay = `${index * 0.1}s`;

                    card.innerHTML = `
                        <div class="card-header">
                            <h3>${buyer.first_name || 'Market Player'}</h3>
                            <span class="badge buyer">Buyer</span>
                        </div>
                        <div class="card-body">
                            <p><span class="icon">📍</span> ${buyer.county || 'N/A'}, ${buyer.country || 'N/A'}</p>
                            <p><span class="icon">📞</span> ${buyer.phone_number || 'No contact provided'}</p>
                            <p><span class="icon">✉️</span> <a href="mailto:${buyer.email}">${buyer.email || 'No email provided'}</a></p>
                            <p class="contact"><a href="https://wa.me/${buyer.phone_number.replace(/\D/g, '')}" target="_blank" title="WhatsApp"><i class="fa-brands fa-whatsapp"></i>Contact Now</a></p>

                        </div>
                    `;
                    grid.appendChild(card);
                });
            } else {
                grid.innerHTML = '<div class="no-results">No registerd buyer in this location</div>';
            }
        }

        function loadBuyers(filterCounty = '') {
            const grid = document.getElementById('buyers-grid');
            const searchBtn = document.getElementById('search-btn');
            const fetchAllBtn = document.getElementById('fetch-buyers-btn');

            if(searchBtn) searchBtn.disabled = true;
            if(fetchAllBtn) fetchAllBtn.disabled = true;
            if(searchBtn) searchBtn.textContent = 'Scanning...';

            fetch('/market_firms/')
                .then(response => response.json())
                .then(data => {
                    let list = data.buyer_list || [];
                    if (filterCounty) {
                        list = list.filter(f => f.county && f.county.toLowerCase().includes(filterCounty.toLowerCase()));
                    }
                    renderBuyers(list);
                })
                .catch(error => {
                    console.error('Error fetching buyers:', error);
                    grid.innerHTML = '<div class="error-msg">Failed to load market data. Please try again later.</div>';
                })
                .finally(() => {
                    if(searchBtn) { searchBtn.disabled = false; searchBtn.textContent = 'Search'; }
                    if(fetchAllBtn) fetchAllBtn.disabled = false;
                });
        }

        document.getElementById('search-btn').addEventListener('click', function() {
            const county = document.getElementById('county-search').value.trim();
            loadBuyers(county);
        });

        document.getElementById('fetch-buyers-btn').addEventListener('click', function() {
            document.getElementById('county-search').value = '';
            loadBuyers();
        });
    </script>
{% endblock %}
