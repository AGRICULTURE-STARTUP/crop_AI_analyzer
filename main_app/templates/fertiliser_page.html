{% load static%}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgriScan | fertilizer</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}?v=1.3">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <link rel="icon" type="image/png" href="{% static 'images/agriscan_favicon.png' %}">
</head>

<body>
    <header>
        <h1>Agri<span>Scan</span></h1>
        <button class="menu-toggle" id="menu-toggle" aria-label="Toggle navigation">
            <i class="fa-solid fa-bars open-icon"></i>
            <i class="fa-solid fa-xmark close-icon" style="display: none;"></i>
        </button>
        <nav class="nav_bar" id="navbar">
            <ul class="nav_list" id="nav-list">
                <li><a href="{% url 'page' %}"> <i class="fa-solid fa-house"></i>Home</a></li>
                <li><a href="{% url 'fertiliser' %}"><i class="fa-solid fa-seedling"></i>Fertiliser/Pesticide</a></li>
                <li><a href="{% url 'market_buyers' %}"> <i class="fa-solid fa-shop"></i>Market/Buyers</a></li>
                <li><a href="{% url 'farmers' %}"><i class="fa-solid fa-wheat-awn"></i>Farmers/sellers</a></li>
                {% if user.is_authenticated %}
                <li><a href="{% url 'logout' %}"> <i class="fa-solid fa-user-xmark"></i>Logout </a></li>
                {% else %}
                <li><a href="{% url 'login' %}"> <i class="fa-solid fa-user-check"></i>Login</a></li>
                {% endif %}
            </ul>
        </nav>
    </header>


    <div class="fertilisers-container">
        <div class="fertilisers-header">
            <h2>Agrovet</h2>
            <p>Connect with reputable suppliers and agricultural agencies.</p>
            <div class="search-bar" style="margin-top: 1.5rem; display: flex; justify-content: center; gap: 0.5rem; flex-wrap: wrap;">
                <input type="text" id="county-search" placeholder="Enter county or location..." style="padding: 0.8rem 1rem; border: 1px solid #ccc; border-radius: 8px; width: 100%; max-width: 300px; font-size: 1rem; outline: none;">
                <button id="search-btn" class="btn-primary" style="padding: 0.8rem 1.5rem; border-radius: 8px; cursor: pointer;">Search</button>
                <button id="fetch-firms-btn" class="btn-secondary" style="padding: 0.8rem 1.5rem; border-radius: 8px; cursor: pointer; background: #f0f0f0; color: #333; border: 1px solid #ccc;">Show All</button>
            </div>
        </div>

        <div class="table-responsive">
            <div id="firms-grid" class="firms-grid">
                <!-- Data will be populated here -->
            </div>
        </div>
    </div>

    <script>
        function renderFirms(firmList) {
            const grid = document.getElementById('firms-grid');
            grid.innerHTML = '';
            if (firmList && firmList.length > 0) {
                firmList.forEach((firm, index) => {
                    const card = document.createElement('div');
                    card.className = 'firm-card animate-up';
                    card.style.animationDelay = `${index * 0.1}s`;

                    card.innerHTML = `
                        <div class="card-header">
                            <h3>${firm.name || 'Unknown Agency'}</h3>
                            <span class="badge ${firm.agency_type}">${firm.agency_type}</span>
                        </div>
                        <div class="card-body">
                            <p><span class="icon">📍</span> ${firm.location || 'Location missing'}</p>
                            <p><span class="icon">✉️</span> <a href="mailto:${firm.email}">${firm.email || 'No email provided'}</a></p>
                            <p><span class="icon">📞</span> ${firm.support_phone || 'No phone provided'}</p>
                        </div>
                    `;
                    grid.appendChild(card);
                });
            } else {
                grid.innerHTML = '<div class="no-results">no registerd agrovet in the area</div>';
            }
        }

        function loadFirms(filterLocation = '') {
            const grid = document.getElementById('firms-grid');
            const searchBtn = document.getElementById('search-btn');
            const fetchAllBtn = document.getElementById('fetch-firms-btn');

            if(searchBtn) searchBtn.disabled = true;
            if(fetchAllBtn) fetchAllBtn.disabled = true;
            if(searchBtn) searchBtn.textContent = 'Searching...';

            fetch('/fertiliser_firms/')
                .then(response => response.json())
                .then(data => {
                    let list = data.fertiliser_firm || [];
                    if (filterLocation) {
                        list = list.filter(f => f.location && f.location.toLowerCase().includes(filterLocation.toLowerCase()));
                    }
                    renderFirms(list);
                })
                .catch(error => {
                    console.error('Error fetching firms:', error);
                    grid.innerHTML = '<div class="error-msg">Failed to load directory. Please try again later.</div>';
                })
                .finally(() => {
                    if(searchBtn) { searchBtn.disabled = false; searchBtn.textContent = 'Search'; }
                    if(fetchAllBtn) fetchAllBtn.disabled = false;
                });
        }

        document.getElementById('search-btn').addEventListener('click', function() {
            const loc = document.getElementById('county-search').value.trim();
            loadFirms(loc);
        });

        document.getElementById('fetch-firms-btn').addEventListener('click', function() {
            document.getElementById('county-search').value = '';
            loadFirms();
        });
    </script>

    <script src="{% static 'js/script.js' %}?v=1.2"></script>
</body>

</html>
