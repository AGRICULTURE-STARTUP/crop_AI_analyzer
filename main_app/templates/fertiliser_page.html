{% extends 'base.html' %}
{% load static %}

{% block title %}AgriScan | Agrovet{% endblock %}

{% block content %}


    <div class="fertilisers-container">
        <div class="fertilisers-header">
            <h2>Agrovet</h2>
            <p>Connect with reputable suppliers and agricultural agencies.</p>
            <div class="search-bar" style="margin-top: 1.5rem; display: flex; justify-content: center; gap: 0.5rem; flex-wrap: wrap;">
                <input type="text" id="county-search" placeholder="Enter county or location..." style="padding: 0.8rem 1rem; border: 1px solid var(--border-color); border-radius: 8px; width: 100%; max-width: 300px; font-size: 1rem; outline: none; background: var(--input-bg); color: var(--text-primary);">
                <button id="search-btn" class="btn-primary" style="padding: 0.8rem 1.5rem; border-radius: 8px; cursor: pointer;">Search</button>
                <button id="fetch-firms-btn" class="btn-secondary" style="padding: 0.8rem 1.5rem; border-radius: 8px; cursor: pointer; background: var(--bg-primary); color: var(--text-primary); border: 1px solid var(--border-color);">Show All</button>
            </div>
        </div>

        <div class="table-responsive">
            <div id="firms-grid" class="firms-grid">
                <!-- Data will be populated here -->
            </div>
        </div>
    </div>

    <script>
        function renderFirms(firmList) {
            const grid = document.getElementById('firms-grid');
            grid.innerHTML = '';
            if (firmList && firmList.length > 0) {
                firmList.forEach((firm, index) => {
                    const card = document.createElement('div');
                    card.className = 'firm-card animate-up';
                    card.style.animationDelay = `${index * 0.1}s`;

                    card.innerHTML = `
                        <div class="card-header">
                            <h3>${firm.name || 'Unknown Agency'}</h3>
                            <span class="badge ${firm.agency_type}">${firm.agency_type}</span>
                        </div>
                        <div class="card-body">
                            <p><span class="icon">📍</span> ${firm.location || 'Location missing'}</p>
                            <p><span class="icon">✉️</span> <a href="mailto:${firm.email}">${firm.email || 'No email provided'}</a></p>
                            <p><span class="icon">📞</span> ${firm.support_phone || 'No phone provided'}</p>
                            <p class="contact"><a href="https://wa.me/${firm.support_phone.replace(/\D/g, '')}" target="_blank" title="WhatsApp"><i class="fa-brands fa-whatsapp"></i>Contact Now</a></p>

                        </div>
                    `;
                    grid.appendChild(card);
                });
            } else {
                grid.innerHTML = '<div class="no-results">no registerd agrovet in the area</div>';
            }
        }

        function loadFirms(filterLocation = '') {
            const grid = document.getElementById('firms-grid');
            const searchBtn = document.getElementById('search-btn');
            const fetchAllBtn = document.getElementById('fetch-firms-btn');

            if(searchBtn) searchBtn.disabled = true;
            if(fetchAllBtn) fetchAllBtn.disabled = true;
            if(searchBtn) searchBtn.textContent = 'Searching...';

            fetch('/fertiliser_firms/')
                .then(response => response.json())
                .then(data => {
                    let list = data.fertiliser_firm || [];
                    if (filterLocation) {
                        list = list.filter(f => f.location && f.location.toLowerCase().includes(filterLocation.toLowerCase()));
                    }
                    renderFirms(list);
                })
                .catch(error => {
                    console.error('Error fetching firms:', error);
                    grid.innerHTML = '<div class="error-msg">Failed to load directory. Please try again later.</div>';
                })
                .finally(() => {
                    if(searchBtn) { searchBtn.disabled = false; searchBtn.textContent = 'Search'; }
                    if(fetchAllBtn) fetchAllBtn.disabled = false;
                });
        }

        document.getElementById('search-btn').addEventListener('click', function() {
            const loc = document.getElementById('county-search').value.trim();
            loadFirms(loc);
        });

        document.getElementById('fetch-firms-btn').addEventListener('click', function() {
            document.getElementById('county-search').value = '';
            loadFirms();
        });
    </script>

{% endblock %}
