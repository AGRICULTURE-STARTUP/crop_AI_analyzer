{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgriScan | Reset Password</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <style>
        .auth-container {
            width: 100%;
            max-width: 450px;
            margin: 4rem auto;
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.07);
            padding: 2.5rem 2rem;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .auth-header {
            text-align: center;
            margin-bottom: 1rem;
            color: #388e3c;
            font-size: 1.8rem;
            font-weight: 700;
        }

        .form-group {
            margin-bottom: 1.2rem;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .form-group label {
            font-weight: 600;
            color: #444;
        }

        .form-control {
            padding: 0.8rem;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 1rem;
            width: 100%;
        }

        .form-control:focus {
            border-color: #388e3c;
            outline: none;
            box-shadow: 0 0 0 2px rgba(56, 142, 60, 0.1);
        }

        .submit-btn {
            width: 100%;
            padding: 0.8rem;
            background-color: #388e3c;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s;
        }

        .submit-btn:hover {
            background-color: #2e7031;
        }

        .auth-footer {
            text-align: center;
            margin-top: 1.5rem;
            font-size: 0.95rem;
            color: #666;
        }

        .auth-footer a {
            color: #388e3c;
            text-decoration: none;
            font-weight: 600;
        }

        .auth-footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>
    <header>
        <h1>AgriScan</h1>
        <nav class="nav_bar">
            <ul class="nav_list">
                <li><a href="{% url 'page' %}">Home</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <div class="auth-container">
            <div class="auth-header">Reset Password</div>
            <p style="text-align: center; color: #666;">Enter your email address and we'll send you a link to reset your
                password.</p>
            <form method="post">
                {% csrf_token %}
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" name="email" id="email" class="form-control" placeholder="yourname@example.com"
                        required>
                </div>
                <button type="submit" class="submit-btn">Send Reset Link</button>
            </form>
            <div class="auth-footer">
                Remember your password? <a href="{% url 'login' %}">Log In</a>
            </div>
        </div>
    </main>
</body>

</html>
