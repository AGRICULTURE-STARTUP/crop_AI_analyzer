services:
  - type: web
    name: crop_AI_analyzer
    env: docker
    plan: free
    autoDeploy: true
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "*"
    staticPublishPath: ./staticfiles
    dockerfilePath: ./Dockerfile
