name: Ingest KAMIS market prices

on:
  schedule:
    # Every 3 hours
    - cron: "0 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ingest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install scrape dependencies
        run: pip install requests==2.32.5 urllib3

      - name: Run KAMIS ingest
        env:
          KAMIS_DB_PATH: ${{ github.workspace }}/apps/api/data/kamis_prices.db
        run: |
          python apps/api/scripts/ingest_kamis_prices.py --limit 10 --delay 0.5

      - name: Commit updated SQLite cache
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/data/kamis_prices.db
          if git diff --staged --quiet; then
            echo "No DB changes to commit."
          else
            git commit -m "chore: refresh KAMIS market price cache"
            git push
          fi
