# Deploy Django API / workers to Contabo via SSH when apps/api or infra change.
# Frontend deploys separately on Vercel (auto on push to apps/web).
#
# Required GitHub secrets (Settings → Secrets and variables → Actions):
#   CONTABO_HOST          — VPS IP or hostname (e.g. 91.x.x.x or api.example.com)
#   CONTABO_USER          — SSH user (e.g. agriscan)
#   CONTABO_SSH_KEY       — private key (full PEM contents)
#   CONTABO_SSH_PORT      — optional, default 22
#   CONTABO_APP_DIR       — optional, default /opt/agriscan

name: Deploy Contabo

on:
  push:
    branches: [main, master]
    paths:
      - "apps/api/**"
      - "infra/**"
      - ".github/workflows/deploy-contabo.yml"
  workflow_dispatch:

concurrency:
  group: deploy-contabo
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.CONTABO_HOST }}
          username: ${{ secrets.CONTABO_USER }}
          key: ${{ secrets.CONTABO_SSH_KEY }}
          port: ${{ secrets.CONTABO_SSH_PORT || 22 }}
          script_stop: true
          script: |
            set -euo pipefail
            APP_DIR="${{ secrets.CONTABO_APP_DIR }}"
            APP_DIR="${APP_DIR:-/opt/agriscan}"
            cd "$APP_DIR"
            git fetch origin
            git reset --hard origin/main || git reset --hard origin/master
            cd infra
            chmod +x scripts/*.sh
            ./scripts/deploy.sh
