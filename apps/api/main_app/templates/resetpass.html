{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgriScan | Reset Password</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}?v=1.2">
    <link rel="icon" type="image/png" href="{% static 'images/agriscan_favicon.png' %}">
</head>

<body class="auth-page">


    <main>
        <div class="auth-card animate-up" style="max-width: 450px;">
            <div class="auth-header-modern">
                <h2>Reset Password</h2>
                <p>Enter your email and we'll send you a recovery link.</p>
            </div>

            <form method="post">
                {% csrf_token %}
                <div class="form-grid" style="grid-template-columns: 1fr;">
                    <div class="form-group full-width">
                        <label class="form-label" for="email">Email Address</label>
                        <input type="email" name="email" id="email" class="form-input-modern"
                            placeholder="yourname@example.com" required>
                    </div>
                </div>
                <button type="submit" class="auth-submit-btn">Send Reset Link</button>
            </form>

            <div class="auth-footer-modern">
                Remembered your password? <a href="{% url 'login' %}">Log In</a>
            </div>
        </div>
    </main>
    <div class="video-container">
        <video autoplay muted loop playsinline class="video-bg">
            <source src="{% static 'video/8659244-hd_1920_1080_30fps.mp4' %}" type="video/mp4">
            Your browser does not support the video tag.
        </video>
        <div class="video-overlay"></div>
    </div>
</body>

</html>
