{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ukulima Bora | Reset Password</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}?v=1.3">
    <link rel="icon" type="image/png" href="{% static 'images/ukulimabora_favicon.png' %}">
</head>

<body class="auth-page">
    <main>
        <div class="auth-card animate-up" style="max-width: 450px;">
            <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 1rem;">
                <a href="{% url 'homepage' %}" style="color: #388e3c; text-decoration: none; font-weight: 500; font-size: 0.9rem; display: flex; align-items: center; gap: 0.4rem;">
                    <i class="fa-solid fa-house"></i> Home
                </a>
            </div>
            <div class="auth-header-modern">
                <h2>Reset Password</h2>
                <p>Enter your email and we'll send you a recovery link.</p>
            </div>

            <form method="post">
                {% csrf_token %}
                <div class="form-grid" style="grid-template-columns: 1fr;">
                    <div class="form-group full-width">
                        <label class="form-label" for="id_email">Email Address</label>
                        <input type="email" name="email" id="id_email" class="form-input-modern"
                            placeholder="yourname@example.com" required>
                        {% if form.email.errors %}
                        <div class="error-message" style="color: #d32f2f; font-size: 0.8rem; margin-top: 0.3rem;">
                            {{ form.email.errors.0 }}</div>
                        {% endif %}
                    </div>
                </div>
                <button type="submit" class="auth-submit-btn">Send Reset Link</button>
            </form>

            <div class="auth-footer-modern">
                Remembered your password? <a href="{% url 'login' %}">Log In</a>
            </div>
        </div>
    </main>
    <div class="video-container">
        <video autoplay muted loop playsinline class="video-bg">
            <source src="{% static 'video/8659244-hd_1920_1080_30fps.mp4' %}" type="video/mp4">
            Your browser does not support the video tag.
        </video>
        <div class="video-overlay"></div>
    </div>
</body>

</html>
