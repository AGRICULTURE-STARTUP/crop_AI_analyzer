{% extends 'base.html' %}
{% load static %}

{% block title %}Ukulima Bora | Farmers{% endblock %}

{% block content %}


    <div class="fertilisers-container">
        <div class="fertilisers-header">
            <h2>Find Farmers </h2>
            <p>Direct from the farm to your door. Find local producers and their fresh harvests.</p>
            <div class="search-bar" style="margin-top: 1.5rem; display: flex; justify-content: center; gap: 0.5rem; flex-wrap: wrap;">
                <input type="text" id="county-search" placeholder="Enter county to search..." style="padding: 0.8rem 1rem; border: 1px solid var(--border-color); border-radius: 8px; width: 100%; max-width: 300px; font-size: 1rem; outline: none; background: var(--input-bg); color: var(--text-primary);">
                <button id="search-btn" class="btn-primary" style="padding: 0.8rem 1.5rem; border-radius: 8px; cursor: pointer;">Search</button>
                <button id="fetch-farmers-btn" class="btn-secondary" style="padding: 0.8rem 1.5rem; border-radius: 8px; cursor: pointer; background: var(--bg-primary); color: var(--text-primary); border: 1px solid var(--border-color);">Show All</button>
            </div>
        </div>

        <div class="table-responsive">
            <div id="farmers-grid" class="firms-grid">
                <!-- Data will be populated here -->
            </div>
        </div>
    </div>

    <script>
        function renderFarmers(farmerList) {
            const grid = document.getElementById('farmers-grid');
            grid.innerHTML = '';
            if (farmerList && farmerList.length > 0) {
                farmerList.forEach((farmer, index) => {
                    const card = document.createElement('div');
                    card.className = 'firm-card animate-up';
                    card.style.animationDelay = `${index * 0.1}s`;

                    card.innerHTML = `
                        <div class="card-header">
                            <h3>${farmer.username || 'Farmer'}</h3>
                            <span class="badge farmer">Farmer</span>
                        </div>
                        <div class="card-body">
                            <p><span class="icon">📍</span> ${farmer.county || 'N/A'}, ${farmer.country || 'N/A'}</p>
                            <p><span class="icon">🌾</span> <strong>Products:</strong> ${farmer.products || 'Mixed crops'}</p>
                            <p><span class="icon">📞</span> ${farmer.phone_number || 'No contact provided'}</p>
                            <p class="contact"><a href="https://wa.me/${farmer.phone_number.replace(/\D/g, '')}" target="_blank" title="WhatsApp"><i class="fa-brands fa-whatsapp"></i>Contact Now</a></p>
                        </div>
                    `;
                    grid.appendChild(card);
                });
            } else {
                grid.innerHTML = '<div class="no-results">No registered farmer in this location</div>';
            }
        }

        function loadFarmers(filterCounty = '') {
            const grid = document.getElementById('farmers-grid');
            const searchBtn = document.getElementById('search-btn');
            const fetchAllBtn = document.getElementById('fetch-farmers-btn');

            if(searchBtn) searchBtn.disabled = true;
            if(fetchAllBtn) fetchAllBtn.disabled = true;
            if(searchBtn) searchBtn.textContent = 'Searching...';

            fetch('/farmer_data/')
                .then(response => response.json())
                .then(data => {
                    let list = data.farmer_list || [];
                    if (filterCounty) {
                        list = list.filter(f => f.county && f.county.toLowerCase().includes(filterCounty.toLowerCase()));
                    }
                    renderFarmers(list);
                })
                .catch(error => {
                    console.error('Error fetching farmers:', error);
                    grid.innerHTML = '<div class="error-msg">Failed to load farmer directory. Please try again.</div>';
                })
                .finally(() => {
                    if(searchBtn) { searchBtn.disabled = false; searchBtn.textContent = 'Search'; }
                    if(fetchAllBtn) fetchAllBtn.disabled = false;
                });
        }

        document.getElementById('search-btn').addEventListener('click', function() {
            const county = document.getElementById('county-search').value.trim();
            loadFarmers(county);
        });

        document.getElementById('fetch-farmers-btn').addEventListener('click', function() {
            document.getElementById('county-search').value = '';
            loadFarmers();
        });

        // Initial load
        loadFarmers();
    </script>
{% endblock %}
