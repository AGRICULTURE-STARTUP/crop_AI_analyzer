upstream agriscan_api {
    server api:8000;
}

server {
    listen 80;
    server_name api.agriscan.co.ke;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name api.agriscan.co.ke;

    ssl_certificate     /etc/letsencrypt/live/api.agriscan.co.ke/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.agriscan.co.ke/privkey.pem;

    client_max_body_size 6m;

    location / {
        proxy_pass http://agriscan_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }
}
