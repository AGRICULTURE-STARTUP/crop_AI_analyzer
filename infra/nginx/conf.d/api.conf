upstream ukulimabora_api {
    server api:8000;
}

# Coarse edge protection; DRF applies tighter per-user/per-feature limits.
limit_req_zone $binary_remote_addr zone=ukulimabora_per_ip:10m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=ukulimabora_connections:10m;

server {
    listen 80;
    server_name api.ukulimabora.co.ke;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name api.ukulimabora.co.ke;

    ssl_certificate     /etc/letsencrypt/live/api.ukulimabora.co.ke/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.ukulimabora.co.ke/privkey.pem;

    client_max_body_size 6m;

    location / {
        limit_req zone=ukulimabora_per_ip burst=20 nodelay;
        limit_conn ukulimabora_connections 20;

        proxy_pass http://ukulimabora_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }
}
